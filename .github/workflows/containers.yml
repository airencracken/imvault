name: Container images
on:
  workflow_call:
    inputs:
      source_ref:
        type: string
        required: false
        default: ''
      release_tag:
        type: string
        required: false
        default: ''
      publish:
        type: boolean
        required: true
permissions:
  contents: read
jobs:
  shared:
    permissions:
      contents: read
      packages: write
    uses: airencracken/comfylib/.github/workflows/containers.yml@57e2a2c00cd36c29a7565e4827e197f93ddfcf39 # v0.7.0
    with:
      source_ref: ${{ inputs.source_ref }}
      release_tag: ${{ inputs.release_tag }}
      publish: ${{ inputs.publish }}
