name: Container images
on:
  workflow_call:
    inputs:
      source_ref:
        type: string
        required: false
        default: ''
      release_tag:
        type: string
        required: false
        default: ''
      publish:
        type: boolean
        required: true
permissions:
  contents: read
jobs:
  shared:
    permissions:
      contents: read
      packages: write
    uses: airencracken/comfylib/.github/workflows/containers.yml@cd7d278abca6def827880e0dd98f3a91a3d9ee01 # v0.7.1
    with:
      source_ref: ${{ inputs.source_ref }}
      release_tag: ${{ inputs.release_tag }}
      publish: ${{ inputs.publish }}
