name: Container images
on:
  workflow_call:
    inputs:
      source_ref:
        type: string
        required: false
        default: ''
      release_tag:
        type: string
        required: false
        default: ''
      publish:
        type: boolean
        required: true
permissions:
  contents: read
jobs:
  shared:
    permissions:
      contents: read
      packages: write
    uses: airencracken/comfylib/.github/workflows/containers.yml@02274ac37791948d8d86c011e0c523f5ee017c51 # v0.4.2
    with:
      source_ref: ${{ inputs.source_ref }}
      release_tag: ${{ inputs.release_tag }}
      publish: ${{ inputs.publish }}
