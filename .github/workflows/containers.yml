name: Container images
on:
  workflow_call:
    inputs:
      source_ref:
        type: string
        required: false
        default: ''
      release_tag:
        type: string
        required: false
        default: ''
      publish:
        type: boolean
        required: true
permissions:
  contents: read
jobs:
  shared:
    permissions:
      contents: read
      packages: write
    uses: airencracken/comfylib/.github/workflows/containers.yml@97d6c188312e1f2146b11cbd98a28a76d0b8e242 # v0.7.2
    with:
      source_ref: ${{ inputs.source_ref }}
      release_tag: ${{ inputs.release_tag }}
      publish: ${{ inputs.publish }}
