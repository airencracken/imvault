name: Container images
on:
  workflow_call:
    inputs:
      source_ref:
        type: string
        required: false
        default: ''
      release_tag:
        type: string
        required: false
        default: ''
      publish:
        type: boolean
        required: true
permissions:
  contents: read
jobs:
  shared:
    permissions:
      contents: read
      packages: write
    uses: airencracken/comfylib/.github/workflows/containers.yml@743cbf2d59f9bab25f4a7b30f4439fda89ad1d4a # v0.4.3
    with:
      source_ref: ${{ inputs.source_ref }}
      release_tag: ${{ inputs.release_tag }}
      publish: ${{ inputs.publish }}
