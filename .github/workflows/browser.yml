        type: string
        required: false
        default: ''
  workflow_dispatch:
permissions:
  contents: read
jobs:
  shared:
    uses: airencracken/comfylib/.github/workflows/browser.yml@5fa44baa2664deb5aba35aee7013045ca65d35e7 # v0.8.0
    with:
      source_ref: ${{ inputs.source_ref }}
