name: Release packages

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release tag to rebuild with the current workflow'
        type: string
        required: false
        default: ''

permissions:
  contents: read

# Builds resolve go.mod alone; a go.work must never point them elsewhere.
env:
  GOWORK: "off"
  RELEASE_TAG_INPUT: ${{ inputs.release_tag }}

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Steps handle their own errors; GitHub's default bash adds -e.
defaults:
  run:
    shell: bash --noprofile --norc {0}

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_tag || github.ref }}
      - name: Validate requested release source
        env:
          RELEASE_REF: ${{ inputs.release_tag != '' && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
        run: |
          # Validate an explicitly requested existing release tag.
          if [ -n "$RELEASE_TAG_INPUT" ]; then
            [[ "$RELEASE_TAG_INPUT" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || exit 1
            release_commit=$(git rev-parse --verify "refs/tags/$RELEASE_TAG_INPUT^{commit}") || exit 1
            test "$release_commit" = "$(git rev-parse HEAD)" || exit 1
          fi
          case "$RELEASE_REF" in
            refs/tags/v*)
              git merge-base --is-ancestor HEAD origin/master || exit 1
              if [ -f VERSION ]; then
                test "$RELEASE_REF" = "refs/tags/v$(cat VERSION)" || exit 1
              fi
              ;;
          esac
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26.11"
          check-latest: true
      - name: Check reachable dependency vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./... || exit 1
      - name: Install test tools
        run: |
          sudo python3 scripts/release/apt_mirror.py || exit 1
          sudo apt-get update || exit 1
          sudo systemctl mask --runtime caddy.service nginx.service apache2.service || exit 1
          sudo apt-get install -y bubblewrap zstd logrotate ffmpeg caddy nginx apache2 || exit 1
      - name: Allow test namespaces on the disposable runner
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # Installed before the checks, which validate the release configuration.
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          version: v2.18.2
          install-only: true
      - name: Repository checks
        run: |
          make check || exit 1
          make test-sandbox || exit 1
          make test-sandbox-mutations || exit 1
          make test-invitation-mutations || exit 1
          make test-web-mutations || exit 1
          make test-settings-mutations || exit 1
          make test-library-mutations || exit 1
          make test-race || exit 1
          make test-proxies || exit 1
      - name: Build archives and Debian packages
        env:
          RELEASE_REF: ${{ inputs.release_tag != '' && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
        run: |
          goreleaser check || exit 1
          case "$RELEASE_REF" in
            refs/tags/v*)
              git merge-base --is-ancestor HEAD origin/master || exit 1
              goreleaser release --clean --skip=publish || exit 1
              ;;
            *)
              goreleaser release --snapshot --clean --skip=publish || exit 1
              ;;
          esac
      - name: Verify release contents
        run: sh scripts/release/check-artifacts.sh
      - name: Scan release executable vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0 || exit 1
          python3 scripts/comfy.py scan-artifacts dist/*_linux_*.tar.gz --scanner "$(go env GOPATH)/bin/govulncheck" || exit 1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-packages
          if-no-files-found: error
          compression-level: 0
          path: |
            dist/*.deb
            dist/*.tar.gz
            dist/*_checksums.txt

  packages:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-packages
          path: dist
      - name: Ubuntu package lifecycle and systemd
        env:
          PACKAGE_ARCH: ${{ matrix.arch }}
        run: |
          sudo python3 scripts/release/apt_mirror.py || exit 1
          sudo apt-get update || exit 1
          sudo apt-get install -y bubblewrap zstd ffmpeg || exit 1
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || exit 1
          sudo env RELEASE_SANDBOX_TEST=1 RELEASE_PACKAGE_TEST=1 sh scripts/release/test-deb.sh dist/imvault_*_"$PACKAGE_ARCH".deb || exit 1
      - name: Debian package lifecycle
        env:
          PACKAGE_ARCH: ${{ matrix.arch }}
        run: |
          docker run --rm -v "$PWD:/work:ro" -w /work \
            -e RELEASE_PACKAGE_TEST=1 -e PACKAGE_ARCH \
            public.ecr.aws/docker/library/debian:trixie-slim@sha256:a29215f6a35e51e22adffa17f89e9d2ef06214e64a2bad10d765c46aea49f11f sh -c '
              # Slim images exclude docs by default; exercise the complete package.
              rm -f /etc/dpkg/dpkg.cfg.d/docker || exit 1
              apt-get update || exit 1
              apt-get install -y ca-certificates curl binutils || exit 1
              sh scripts/release/test-deb.sh dist/imvault_*_"$PACKAGE_ARCH".deb
            ' || exit 1

  containers:
    needs: [build, packages]
    uses: ./.github/workflows/containers.yml
    permissions:
      contents: read
      packages: write
    with:
      source_ref: ${{ inputs.release_tag || github.ref }}
      release_tag: ${{ inputs.release_tag || github.ref_name }}
      publish: ${{ (startsWith(github.ref, 'refs/tags/v') || startsWith(inputs.release_tag, 'v')) && github.repository == 'airencracken/imvault' }}

  publish:
    if: (startsWith(github.ref, 'refs/tags/v') || startsWith(inputs.release_tag, 'v')) && github.repository == 'airencracken/imvault'
    needs: [build, packages, containers]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-packages
          path: dist
      - name: Publish tested artifacts to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft > release-draft; then
            [ "$(cat release-draft)" = true ] || { echo 'Release already published; refusing to replace it.' >&2; exit 1; }
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --generate-notes --title "Imvault $RELEASE_TAG" || exit 1
          fi
          gh release upload "$RELEASE_TAG" dist/* --clobber || exit 1
          case "$RELEASE_TAG" in
            *-*) gh release edit "$RELEASE_TAG" --draft=false --prerelease || exit 1 ;;
            *) gh release edit "$RELEASE_TAG" --draft=false || exit 1 ;;
          esac
