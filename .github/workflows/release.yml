name: Release packages

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26.x"
          check-latest: true
      - name: Install test tools
        run: |
          sudo apt-get update || exit 1
          sudo apt-get install -y logrotate ffmpeg || exit 1
      - name: Repository checks
        run: |
          make check || exit 1
          make test-race || exit 1
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          version: v2.18.2
          install-only: true
      - name: Build archives and Debian packages
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          goreleaser check || exit 1
          case "$RELEASE_REF" in
            refs/tags/v*)
              git merge-base --is-ancestor HEAD origin/master || exit 1
              goreleaser release --clean --skip=publish || exit 1
              ;;
            *)
              goreleaser release --snapshot --clean --skip=publish || exit 1
              ;;
          esac
      - name: Verify release contents
        run: sh scripts/release/check-artifacts.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-packages
          if-no-files-found: error
          compression-level: 0
          path: |
            dist/*.deb
            dist/*.tar.gz
            dist/*_checksums.txt

  packages:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-packages
          path: dist
      - name: Ubuntu package lifecycle and systemd
        env:
          PACKAGE_ARCH: ${{ matrix.arch }}
        run: |
          sudo apt-get update || exit 1
          sudo env RELEASE_PACKAGE_TEST=1 sh scripts/release/test-deb.sh dist/imvault_*_"$PACKAGE_ARCH".deb || exit 1
      - name: Debian package lifecycle
        env:
          PACKAGE_ARCH: ${{ matrix.arch }}
        run: |
          docker run --rm -v "$PWD:/work:ro" -w /work \
            -e RELEASE_PACKAGE_TEST=1 -e PACKAGE_ARCH \
            debian:trixie-slim sh -c '
              apt-get update || exit 1
              apt-get install -y ca-certificates curl binutils || exit 1
              sh scripts/release/test-deb.sh dist/imvault_*_"$PACKAGE_ARCH".deb
            ' || exit 1

  publish:
    if: startsWith(github.ref, 'refs/tags/v') && github.repository == 'airencracken/imvault'
    needs: [build, packages]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-packages
          path: dist
      - name: Publish tested artifacts to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft > release-draft; then
            [ "$(cat release-draft)" = true ] || { echo 'Release already published; refusing to replace it.' >&2; exit 1; }
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --generate-notes --title "imvault $RELEASE_TAG" || exit 1
          fi
          gh release upload "$RELEASE_TAG" dist/* --clobber || exit 1
          case "$RELEASE_TAG" in
            *-*) gh release edit "$RELEASE_TAG" --draft=false --prerelease || exit 1 ;;
            *) gh release edit "$RELEASE_TAG" --draft=false || exit 1 ;;
          esac
