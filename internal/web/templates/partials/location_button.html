{{define "location_button"}}
<form class="inline sharing-control" method="post" action="/f/{{.File.ID}}/location">
  <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
  <span>Location is <strong>{{if .File.ShowLocation}}shown{{else}}hidden{{end}}</strong>.</span>
  {{if .File.ShowLocation}}
  <button class="btn small" type="submit" name="location" value="hidden">Hide location</button>
  {{else}}
  <button class="btn small" type="submit" name="location" value="shown">Show location</button>
  {{end}}
</form>
{{end}}
