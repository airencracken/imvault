{{define "location_button"}}
<form class="inline meta-control" method="post" action="/f/{{.File.ID}}/location">
  <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
  <label class="row">Location
    <select name="location" aria-label="Location sharing for {{.File.OriginalName}}">
      {{$current := .File.Location}}
      {{range .MetadataLevels}}
      <option value="{{.}}" {{if eq . $current}}selected{{end}} title="{{.LocationExplain}}">{{.LocationLabel}}</option>
      {{end}}
    </select>
    <button class="btn small" type="submit">Set</button>
  </label>
</form>
{{end}}
