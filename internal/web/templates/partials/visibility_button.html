{{define "visibility_button"}}
<form class="inline vis-control" method="post" action="/f/{{.File.ID}}/visibility"
      hx-post="/f/{{.File.ID}}/visibility" hx-target="this" hx-swap="outerHTML">
  <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
  <span class="muted">Visible to</span>
  {{$current := .File.Visibility}}
  {{range .VisibilityLevels}}
  <button class="btn{{if eq . $current}} primary{{end}}" type="submit"
          name="visibility" value="{{.}}" title="{{.Explain}}"
          {{if eq . $current}}aria-pressed="true"{{end}}>{{.Label}}</button>
  {{end}}
</form>
{{end}}
