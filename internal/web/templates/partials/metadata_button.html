{{define "metadata_button"}}
<form class="inline sharing-control" method="post" action="/f/{{.File.ID}}/metadata">
  <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
  <span>Camera details are <strong>{{if .File.ShowCamera}}shown{{else}}hidden{{end}}</strong>.</span>
  {{if .File.ShowCamera}}
  <button class="btn small" type="submit" name="metadata" value="hidden">Hide camera details</button>
  {{else}}
  <button class="btn small" type="submit" name="metadata" value="shown">Show camera details</button>
  {{end}}
</form>
{{end}}
