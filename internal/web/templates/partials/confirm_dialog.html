{{define "confirm_dialog"}}
{{/* Filled in and opened by app.js for forms that carry data-confirm. */}}
<dialog class="modal" id="confirm-dialog" aria-labelledby="confirm-message">
  <p id="confirm-message"></p>
  <p class="muted" id="confirm-detail" hidden></p>
  <div class="modal-actions">
    <button class="btn" type="button" data-confirm-cancel>Cancel</button>
    <button class="btn danger" type="button" data-confirm-accept>Confirm</button>
  </div>
</dialog>
{{end}}
