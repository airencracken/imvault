{{define "content"}}
<section class="narrow">
  <h1>Create an account</h1>
  <form class="panel stack" method="post" action="/register">
    <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
    <label>Username
      <input name="username" value="{{.Username}}" autocomplete="username" autofocus required
             pattern="[A-Za-z0-9_.-]{3,32}" title="3-32 characters: letters, digits, dot, dash, underscore">
    </label>
    <label>Email <span class="muted">(optional)</span>
      <input name="email" type="email" value="{{.Email}}" autocomplete="email">
    </label>
    <label>Password
      <input name="password" type="password" autocomplete="new-password" minlength="8" required>
    </label>
    <button class="btn primary" type="submit">Create account</button>
  </form>
  <p class="muted">Already registered? <a href="/login">Sign in</a>.</p>
</section>
{{end}}
