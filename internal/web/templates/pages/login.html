{{define "content"}}
<section class="narrow">
  <h1>Sign in</h1>

  {{if .OIDCName}}
  <p>
    <a class="btn primary wide" href="/auth/oidc/start">Sign in with {{.OIDCName}}</a>
  </p>
  <p class="muted center">or use your password</p>
  {{end}}

  <form class="panel stack" method="post" action="/login">
    <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
    <input type="hidden" name="next" value="{{.Next}}">
    <label>Username
      <input name="username" value="{{.Username}}" autocomplete="username" autofocus required>
    </label>
    <label>Password
      <input name="password" type="password" autocomplete="current-password" required>
    </label>
    <button class="btn primary" type="submit">Sign in</button>
  </form>
  <p class="muted"><a href="/forgot">Forgot your password?</a></p>
  {{if .SignupOpen}}
  <p class="muted">No account yet? <a href="/register">Register</a>.</p>
  {{end}}
</section>
{{end}}
