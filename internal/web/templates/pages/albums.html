{{define "content"}}
<header class="page-head">
  <h1>Albums</h1>
</header>

<form class="panel stack" method="post" action="/albums">
  <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
  <h2>New album</h2>
  <label>Title
    <input name="title" maxlength="120" required autocomplete="off">
  </label>
  <label>Description <span class="muted">(optional)</span>
    <input name="description" maxlength="500" autocomplete="off">
  </label>
  <label class="row">Visible to
    <select name="visibility">
      {{$default := .DefaultVisibility}}
      {{range .VisibilityLevels}}
      <option value="{{.}}" {{if eq . $default}}selected{{end}}>{{.Label}} — {{.Explain}}</option>
      {{end}}
    </select>
  </label>
  <button class="btn primary" type="submit">Create album</button>
</form>

{{if .Albums}}
<div class="album-list">
  {{range .Albums}}
  <a class="album-card" href="/a/{{.Slug}}">
    <strong>{{.Title}}</strong>
    <span class="muted">{{.FileCount}} image{{if ne .FileCount 1}}s{{end}}</span>
    {{if not .Visibility.IsPublic}}<span class="badge private">{{.Visibility.ShortLabel}}</span>{{end}}
  </a>
  {{end}}
</div>
{{else}}
<p class="empty">No albums yet. Create one above.</p>
{{end}}
{{end}}
