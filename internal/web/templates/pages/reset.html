{{define "content"}}
<section class="narrow">
  <h1>Choose a new password</h1>

  {{if .Error}}<p class="flash err">{{.Error}}</p>{{end}}

  {{if .Token}}
  <form class="panel stack" method="post" action="/reset/{{.Token}}">
    <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
    {{if .Username}}<p class="muted">Setting a new password for <strong>{{.Username}}</strong>.</p>{{end}}
    <label>New password
      <input name="password" type="password" autocomplete="new-password" minlength="8" required autofocus>
    </label>
    <label>Confirm new password
      <input name="password_confirm" type="password" autocomplete="new-password" minlength="8" required>
    </label>
    <button class="btn primary" type="submit">Set password</button>
  </form>
  {{end}}

  <p class="muted">Need a new link? <a href="/forgot">Request one</a>.</p>
</section>
{{end}}
