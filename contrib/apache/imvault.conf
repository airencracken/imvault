# Apache 2.4 virtual hosts. See docs/reverse-proxies.md.
# Requires ssl, proxy, proxy_http, headers, and alias modules.
# The server's main configuration must listen on ports 80 and 443.
<VirtualHost *:80>
	ServerName img.example.com
	Redirect 308 / https://img.example.com/
</VirtualHost>

<VirtualHost *:443>
	ServerName img.example.com
	SSLEngine on
	SSLCertificateFile /etc/letsencrypt/live/img.example.com/fullchain.pem
	SSLCertificateKeyFile /etc/letsencrypt/live/img.example.com/privkey.pem
	SSLProtocol -all +TLSv1.2 +TLSv1.3

	ProxyRequests Off
	ProxyPreserveHost On
	ProxyAddHeaders Off
	# Replace incoming values before forwarding to the loopback application.
	RequestHeader set X-Forwarded-For "expr=%{REMOTE_ADDR}"
	RequestHeader set X-Real-IP "expr=%{REMOTE_ADDR}"
	RequestHeader set X-Forwarded-Proto "https"
	RequestHeader set X-Forwarded-Host "expr=%{HTTP_HOST}"
	RequestHeader unset Forwarded
	# Entire request, including multipart overhead: 256 MiB.
	LimitRequestBody 268435456
	ProxyTimeout 300
	ProxyPass / http://127.0.0.1:8080/ connectiontimeout=5 timeout=300
	ProxyPassReverse / http://127.0.0.1:8080/
</VirtualHost>
